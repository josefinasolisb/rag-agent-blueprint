[project]
name = "josefina"
version = "0.1.0"
description = "Non-functional reference scaffold for a RAG multi-agent system: cascading ingestion, rule-based moderation, chunk/embed/index, an agent graph with mode routing and tools, a deterministic post-generation guardrail, and an evals harness."
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/josefina"]
